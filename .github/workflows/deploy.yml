name: Deploy Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            UUID
            PASSWORD
            SSPASS
            S5HTTPUSER
            S5HTTPPASS
        env:
          UUID: ${{ secrets.UUID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SSPASS: ${{ secrets.SSPASS }}
          S5HTTPUSER: ${{ secrets.S5HTTPUSER }}
          S5HTTPPASS: ${{ secrets.S5HTTPPASS }}
